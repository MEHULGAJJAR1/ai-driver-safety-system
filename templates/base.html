<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Driver Drowsiness Detection{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">&#128064;</span>
      <span>Driver Drowsiness <b>Detection</b></span>
    </div>
    <nav class="nav">
      <a href="{{ url_for('index') }}" class="{% block nav_live %}{% endblock %}">Live Monitor</a>
      <a href="{{ url_for('upload_page') }}" class="{% block nav_upload %}{% endblock %}">Analyze File</a>
      <a href="{{ url_for('history_page') }}" class="{% block nav_history %}{% endblock %}">History</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>Driver Drowsiness Detection Dashboard &middot; EAR + MAR + Head-Pose + CNN</span>
    <span class="disclaimer">Assistive prototype only &mdash; not a substitute for safe driving.</span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
